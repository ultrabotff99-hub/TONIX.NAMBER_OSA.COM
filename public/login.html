<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 Private Access — Cyber Tool</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{min-height:100vh;background:linear-gradient(135deg,#0a0e27,#1a1a3e,#0f0c29);color:#fff;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .box{max-width:400px;width:100%;background:rgba(255,255,255,0.04);backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:32px;box-shadow:0 25px 50px rgba(0,0,0,0.6)}
  h1{font-size:20px;text-align:center;margin-bottom:6px;
    background:linear-gradient(90deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .warn{text-align:center;font-size:11px;color:#ff6b6b;margin-bottom:22px;padding:8px;
    background:rgba(255,0,0,0.08);border-radius:8px;border:1px solid rgba(255,0,0,0.2)}
  .tabs{display:flex;gap:6px;margin-bottom:18px}
  .tab{flex:1;padding:10px;text-align:center;background:rgba(0,0,0,0.3);border-radius:8px;
    cursor:pointer;font-size:13px;border:1px solid transparent;transition:.2s}
  .tab.active{background:rgba(0,212,255,0.15);border-color:#00d4ff;color:#00d4ff}
  input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;color:#fff;font-size:14px;outline:none;margin-bottom:12px;transition:.2s}
  input:focus{border-color:#00d4ff;box-shadow:0 0 12px rgba(0,212,255,0.25)}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(90deg,#00d4ff,#7b2ff7);
    color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
  .btn:hover{transform:translateY(-2px);opacity:0.92}
  .alert{padding:10px;border-radius:8px;margin-top:12px;font-size:12px;text-align:center}
  .err{background:rgba(255,0,0,0.15);border:1px solid rgba(255,0,0,0.4);color:#ff6b6b}
  .ok{background:rgba(0,255,163,0.15);border:1px solid rgba(0,255,163,0.4);color:#00ffa3}
  .hidden{display:none}
</style>
</head>
<body>
<div class="box">
  <h1>🔒 Private Cyber Tool</h1>
  <p class="warn">⚡ Invite-only · Authorized Analysts Only ⚡</p>

  <div class="tabs">
    <div class="tab active" data-t="login">Login</div>
    <div class="tab" data-t="register">Register</div>
  </div>

  <!-- LOGIN FORM (യൂസർനെയിം, പാസ്‌വേഡ് മാത്രം) -->
  <div id="loginForm">
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button class="btn" onclick="doLogin()">Login</button>
  </div>

  <!-- REGISTER FORM (യൂസർനെയിം, ഇൻവൈറ്റ് കോഡ്, പാസ്‌വേഡ്) -->
  <div id="registerForm" class="hidden">
    <input type="text" id="regUser" placeholder="Choose Username">
    <input type="text" id="regInvite" placeholder="Invite Code" style="text-transform:uppercase">
    <input type="password" id="regPass" placeholder="Password (min 8 chars)">
    <button class="btn" onclick="doRegister()">Submit Request</button>
    <p style="font-size:11px;color:#888;margin-top:10px;text-align:center">
      അഡ്മിൻ അപ്രൂവ് ചെയ്തതിന് ശേഷം മാത്രം ലോഗിൻ ചെയ്യാൻ സാധിക്കും.
    </p>
  </div>

  <div id="msg"></div>
</div>

<script>
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const isLogin = t.dataset.t === 'login';
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
  document.getElementById('msg').innerHTML = '';
});

function showMsg(text, ok = false) {
  document.getElementById('msg').innerHTML = `<div class="alert ${ok ? 'ok' : 'err'}">${text}</div>`;
}

async function call(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

async function doLogin() {
  try {
    await call('/api/login', {
      username: document.getElementById('loginUser').value.trim(),
      password: document.getElementById('loginPass').value
    });
    window.location.href = '/';
  } catch (e) { showMsg('❌ ' + e.message); }
}

async function doRegister() {
  try {
    const res = await call('/api/register', {
      username: document.getElementById('regUser').value.trim(),
      inviteCode: document.getElementById('regInvite').value.trim(),
      password: document.getElementById('regPass').value
    });
    showMsg('✅ ' + res.message, true);
    document.getElementById('regUser').value = '';
    document.getElementById('regPass').value = '';
  } catch (e) { showMsg('❌ ' + e.message); }
}
</script>
</body>
</html>
